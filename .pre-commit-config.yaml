repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        language: system
        entry: uv run --frozen pyrefly check
        pass_filenames: false
        files: ^(src|tests)/.*\.pyi?$

  # Dogfooding hook temporarily disabled: diffract-validate is currently broken.
