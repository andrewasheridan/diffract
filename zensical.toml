[project]
site_name = "sheridan-diffract"
site_description = "Classifies public API changes between git commits as conventional commit types"
repo_url = "https://github.com/andrewasheridan/diffract"
repo_name = "andrewasheridan/diffract"
docs_dir = "docs"
site_dir = "site"
nav = [
  {"Home" = "index.md"},
  {"Getting started" = "getting-started.md"},
  {"Configuration" = "configuration.md"},
  {"API changes" = "api-changes.md"},
  {"CLI and exit codes" = "cli.md"},
  {"commit-msg hook" = "commit-msg-hook.md"},
  {"GitHub Actions" = "github-actions.md"},
  {"JSON output" = "json-output.md"},
  {"API reference" = "api/api.md"},
]

[project.theme]
variant = "classic"

# A markdown_extensions table replaces all the Zensical defaults. Thus, this list
# repeats the defaults that the pages use.
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]

# docs/index.md includes README.md from outside docs/.
# check_paths makes the build fail if an included file does not exist.
[project.markdown_extensions.pymdownx.snippets]
check_paths = true

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
show_root_heading = true
members_order = "source"
