version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install all dependencies
    cmds:
      - uv sync

  lock:check:
    desc: Check that uv.lock is up to date with pyproject.toml
    cmds:
      - uv lock --check

  lint:
    desc: Run ruff linter and autofix issues
    cmds:
      - uv run ruff check --fix .

  lint:check:
    desc: Run ruff linter (check only, no fixes)
    cmds:
      - uv run ruff check .

  format:
    desc: Run ruff formatter
    cmds:
      - uv run ruff format .

  format:check:
    desc: Check formatting without writing
    cmds:
      - uv run ruff format --check .

  typecheck:
    desc: Run mypy strict type checking
    cmds:
      - uv run mypy --strict src/

  test:
    desc: Run pytest with coverage
    cmds:
      - uv run pytest --cov {{.CLI_ARGS}}

  security:check:
    desc: Run bandit security linter on src/
    cmds:
      - uv run bandit -r src/

  check:
    desc: Run all gates (lint:check, format:check, typecheck, test)
    cmds:
      - task: lint:check
      - task: format:check
      - task: typecheck
      - task: test

  docs:build:
    desc: Build Zensical documentation
    cmds:
      - cp README.md docs/index.md
      - uv run zensical build

  docs:serve:
    desc: Serve Zensical documentation locally
    cmds:
      - cp README.md docs/index.md
      - uv run zensical serve

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist/ .coverage htmlcov/ .mypy_cache/ .ruff_cache/ __pycache__/
      - find . -type d -name __pycache__ -exec rm -rf {} +
      - find . -type f -name "*.pyc" -delete
