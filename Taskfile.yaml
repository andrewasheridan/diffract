version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install all dependencies
    cmds:
      - uv sync

  lock:check:
    desc: Check that uv.lock is up to date with pyproject.toml
    cmds:
      - uv lock --check

  lint:
    desc: Run ruff linter and autofix issues
    cmds:
      - uv run ruff check --fix .

  lint:check:
    desc: Run ruff linter (check only, no fixes)
    cmds:
      - uv run ruff check .

  format:
    desc: Run ruff formatter
    cmds:
      - uv run ruff format .

  format:check:
    desc: Check formatting without writing
    cmds:
      - uv run ruff format --check .

  typecheck:
    desc: Run pyrefly type checking
    cmds:
      - uv run pyrefly check

  test:
    desc: Run pytest with coverage
    cmds:
      - uv run pytest --cov {{.CLI_ARGS}}

  security:check:
    desc: Run bandit security linter on src/
    cmds:
      - uv run bandit -r src/

  sdist:check:
    desc: Fail if the sdist has a top-level entry other than the files it should ship
    cmds:
      - |
        dist="$(mktemp -d)"
        trap 'rm -rf "$dist"' EXIT
        uv build --sdist --out-dir "$dist" --quiet
        unexpected="$(tar -tzf "$dist"/*.tar.gz | cut -d/ -f2 | grep -v '^$' | sort -u \
          | grep -vxF -e .gitignore -e CHANGELOG.md -e LICENSE -e PKG-INFO -e README.md \
            -e pyproject.toml -e src -e tests || true)"
        if [ -n "$unexpected" ]; then
          printf 'The sdist has unexpected top-level entries:\n%s\n' "$unexpected" >&2
          echo "Check [tool.hatch.build.targets.sdist] in pyproject.toml." >&2
          exit 1
        fi

  api:update:
    desc: Write the public API of src/sheridan/ to api.txt
    cmds:
      - uv run iceberg src/sheridan/ --output api.txt

  api:check:
    desc: Fail if the public API is different from api.txt
    cmds:
      - |
        if ! uv run iceberg src/sheridan/ | diff -u api.txt -; then
          echo "The public API is different from api.txt. Run 'task api:update' and commit api.txt." >&2
          exit 1
        fi

  check:
    desc: Run all gates (lint:check, format:check, typecheck, test, sdist:check, api:check)
    cmds:
      - task: lint:check
      - task: format:check
      - task: typecheck
      - task: test
      - task: sdist:check
      - task: api:check

  docs:build:
    desc: Build Zensical documentation
    cmds:
      - uv run zensical build --clean

  docs:serve:
    desc: Serve Zensical documentation locally
    cmds:
      - uv run zensical serve

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist/ .coverage htmlcov/ .ruff_cache/ __pycache__/
      - find . -type d -name __pycache__ -exec rm -rf {} +
      - find . -type f -name "*.pyc" -delete
