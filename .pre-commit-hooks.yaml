# Pre-commit hook definitions for sheridan-diffract.
#
# To use these hooks in another project, add the following to your
# .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/andrewasheridan/diffract
#       rev: v<VERSION>
#       hooks:
#         - id: diffract-validate

- id: diffract-validate
  name: diffract (validate commit message type)
  description: >
    Checks that the commit type tells enough about the change to the public
    API. Removed public names need a '!' or a 'BREAKING CHANGE:' footer. Added
    public names need 'feat' or a '!'. If no public name changed, each known
    type passes. A message with no known type fails. Merge, revert, fixup,
    amend and squash messages from git pass. Set the source and test directories in
    diffract.toml or pyproject.toml [tool.diffract], not in the hook args.
  language: python
  entry: diffract --validate-msg-file
  pass_filenames: true
  stages: [commit-msg]
