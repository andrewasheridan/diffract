# Pre-commit hook definitions for sheridan-diffract.
#
# To use these hooks in another project, add the following to your
# .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/sheridan/diffract
#       rev: v<VERSION>
#       hooks:
#         - id: diffract-validate

- id: diffract-validate
  name: diffract (validate commit message type)
  description: >
    Checks that the commit message tells the API change that diffract finds.
    Removed public names need a '!' or a 'BREAKING CHANGE:' footer. Added
    public names need 'feat' or a '!'. Exits 1 if the message tells less.
    Types other than feat, fix and refactor are never blocked. Configure the source directory via diffract.toml or
    pyproject.toml [tool.diffract] rather than hook args.
  language: python
  entry: diffract --validate-msg-file
  pass_filenames: true
  stages: [commit-msg]
