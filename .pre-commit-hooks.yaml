# Pre-commit hook definitions for sheridan-diffract.
#
# To use these hooks in another project, add the following to your
# .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/andrewasheridan/diffract
#       rev: v<VERSION>
#       hooks:
#         - id: diffract-validate

- id: diffract-validate
  name: diffract (validate commit message type)
  description: >
    Checks that the commit type is possible for the change that diffract finds.
    Removed public names need a '!' or a 'BREAKING CHANGE:' footer. Added
    public names need 'feat' or a '!'. Code changes need fix, refactor, perf,
    style, feat or a '!'. Test changes need test. Other changes need docs, ci,
    chore or build. A message with no known type fails. Merge, revert, fixup
    and squash messages from git pass. Set the source and test directories in
    diffract.toml or pyproject.toml [tool.diffract], not in the hook args.
  language: python
  entry: diffract --validate-msg-file
  pass_filenames: true
  stages: [commit-msg]
