[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "sheridan-diffract"
version = "1.0.1"
description = "Classifies public API changes between git commits as conventional commit types"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Andrew Sheridan", email = "andrewasheridan@gmail.com" }]
keywords = ["api", "conventional-commits", "semver", "git", "pre-commit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = [
    "sheridan-iceberg>=2.0.0,<3",
    "gitpython>=3.1.46",
]

[project.urls]
Repository = "https://github.com/andrewasheridan/diffract"
Issues = "https://github.com/andrewasheridan/diffract/issues"
Changelog = "https://github.com/andrewasheridan/diffract/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14.0",
]
dev = [
    { include-group = "test" },
    "ruff>=0.15.7",
    "pyrefly>=1.4.1",
    "commitizen>=4.13.9",
    "prek>=0.5.10",
    "bandit[toml]>=1.9.4",
    "zensical",
    "mkdocstrings[python]>=1.0.3",
]

[project.scripts]
diffract = "sheridan.diffract.cli:main"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sheridan"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
src = ["src"]
line-length = 120
exclude = [".claude/worktrees"]

[tool.ruff.lint]
select = [
    "D",   # pydocstyle errors
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = []
extend-select = [
    "D400",
    "D401",
    "D404",
    "D406",
]

[tool.ruff.lint.per-file-ignores]
# Ignore `D` errors in tests dir
"**/tests/**" = ["D"]
"test_*.py" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["sheridan"]

[tool.ruff.lint.pydocstyle]
convention = "google"
# The google convention turns off D203, D204, D213, D215, D400, D401, D404, D406,
# D407, D408, D409, and D413. `extend-select` above turns D400, D401, D404, and
# D406 back on. D401 lets "Return" through (it is imperative), so
# tests/unit/test_docstring_style.py rejects docstrings that start with it.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "."]
python-version = "3.14.0"
preset = "strict"
check-unannotated-defs = true
infer-return-types = "never"

[tool.pyrefly.errors]
implicit-any = "error"
no-any-return = "error"
method-assign = "error"
unannotated-return = "error"
implicit-any-parameter = "error"
redundant-cast = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sheridan.diffract --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src/sheridan/diffract"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = [
    # Structurally unreachable: argparse with required=True never falls through.
    "parser\\.print_help\\(\\)",
    "sys\\.exit\\(1\\)$",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.1"
version_files = [
    "pyproject.toml:^version",
]
tag_format = "v$version"
pre_bump_hooks = ["uv lock", "git add uv.lock"]
