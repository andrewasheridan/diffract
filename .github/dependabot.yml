# Dependabot opens pull requests that update the GitHub Actions in .github/workflows.
#
# The workflows pin each action by commit SHA with a version comment.
# Dependabot updates the SHA and the comment together.
# dependabot-auto-merge.yaml turns on auto-merge for these pull requests.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
