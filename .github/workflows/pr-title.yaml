# Enforce Conventional Commits format on pull request titles.
#
# Uses pull_request_target so the workflow runs with repo permissions even for
# forks. This is safe only because the job never checks out or runs code from
# the pull request: it reads the title through the API and nothing else.
# Only pull-requests: read is needed — no write access required.
#
# Checks that need the pull request's code (such as validating the title against
# diffract's detected API change) belong in a `pull_request` job in ci.yaml,
# which gets a read-only token and no secrets.

name: PR title

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

jobs:
  lint-pr-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.pull_request.head.ref, 'chore/version-bump-')"
    permissions:
      pull-requests: read

    steps:
      - name: Validate conventional commit format
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
