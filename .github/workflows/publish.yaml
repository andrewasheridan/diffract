# Publish sheridan-diffract to PyPI on version tag push.
#
# Prerequisites — register this repo as a trusted publisher on pypi.org:
#   pypi.org → Account Settings → Publishing → Add a new pending publisher
#     Owner:      andrewasheridan
#     Repository: diffract
#     Workflow:   publish.yaml
#     Environment: pypi   (must match the `environment:` name on the publish job)
#
# Once registered, PyPI trusts GitHub's OIDC token — no API token secrets needed.
#
# Triggered by tag-on-merge.yaml pushing a v* tag. Using push.tags (not
# workflow_call) so GitHub issues a first-party OIDC token — workflow_call
# produces a reusable-workflow token that PyPI's trusted publisher rejects.

name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # Allows manual re-runs via gh CLI or UI

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Build sdist and wheel
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sheridan-diffract
    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
