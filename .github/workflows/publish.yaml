# Publish sheridan-diffract to PyPI on version tag push.
#
# Prerequisites — register this repo as a trusted publisher on pypi.org:
#   pypi.org → Account Settings → Publishing → Add a new pending publisher
#     Owner:      andrewasheridan
#     Repository: diffract
#     Workflow:   publish.yaml
#     Environment: pypi   (must match the `environment:` name on the publish job)
#
# Once registered, PyPI trusts GitHub's OIDC token — no API token secrets needed.
#
# Triggered by tag-on-merge.yaml pushing a v* tag. Using push.tags (not
# workflow_call) so GitHub issues a first-party OIDC token — workflow_call
# produces a reusable-workflow token that PyPI's trusted publisher rejects.

name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # Allows manual re-runs via gh CLI or UI

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Build sdist and wheel
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sheridan-diffract
    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
