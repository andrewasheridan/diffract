# Close a parent issue (an epic) when all of its sub-issues are closed.
#
# GitHub shows the progress of sub-issues, but it does not close the parent.
# When an issue closes, this job goes up the chain of parents. It closes each
# parent that has no open sub-issues.
#
# Start the workflow by hand (workflow_dispatch) to examine all open issues.
# This closes the finished parents that the job did not close before.
#
# A close that GITHUB_TOKEN makes does not start this workflow again. Thus, the
# job itself goes up the full chain of parents.

name: Close finished epics

on:
  issues:
    types: [closed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: close-finished-epics
  cancel-in-progress: false

jobs:
  close-finished-parents:
    name: Close finished parents
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Close parents whose sub-issues are all closed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CLOSED_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          # Print the number of the parent of the issue. Print nothing if the issue has no parent.
          parent_of() {
            gh api "repos/$REPO/issues/$1" --jq '.parent_issue_url // "" | split("/") | last // ""'
          }

          # Succeed if the issue is open and all of its sub-issues are closed.
          is_finished() {
            gh api "repos/$REPO/issues/$1" --jq '
              .state == "open"
              and .sub_issues_summary.total > 0
              and .sub_issues_summary.completed == .sub_issues_summary.total
            ' | grep -qx true
          }

          close_issue() {
            gh issue close "$1" --repo "$REPO" --reason completed \
              --comment "Closed: all sub-issues are closed."
            echo "Closed #$1"
          }

          if [ -z "$CLOSED_ISSUE" ]; then
            candidates=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null and .sub_issues_summary.total > 0) | .number')

            for number in $candidates; do
              if is_finished "$number"; then
                close_issue "$number"
              fi
            done
            exit 0
          fi

          number=$(parent_of "$CLOSED_ISSUE")
          while [ -n "$number" ] && is_finished "$number"; do
            close_issue "$number"
            number=$(parent_of "$number")
          done
