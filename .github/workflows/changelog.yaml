name: Update changelog

on:
  workflow_dispatch:

jobs:
  changelog:
    name: Regenerate CHANGELOG.md
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Regenerate CHANGELOG.md
        run: uv run cz changelog

      - name: Open PR if changelog changed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog updates needed."
          else
            BRANCH="chore/changelog-update-${{ github.run_number }}"
            git checkout -b "$BRANCH"
            git add CHANGELOG.md
            git commit -m "chore: update CHANGELOG.md"
            git push origin "$BRANCH"
            gh pr create \
              --title "chore: update CHANGELOG.md" \
              --body "A person started this workflow by hand. It made CHANGELOG.md again from the commits." \
              --base main \
              --head "$BRANCH"
            gh pr edit "$BRANCH" --add-label automated || true
          fi
