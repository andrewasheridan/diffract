name: Bump version

on:
  push:
    branches: [main]

jobs:
  bump:
    name: Commitizen bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check for bump commit (infinite loop guard)
        id: guard
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$HEAD_MSG" == bump:* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.guard.outputs.skip == 'false'
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        if: steps.guard.outputs.skip == 'false'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: uv sync --locked

      - name: Configure git identity
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: steps.guard.outputs.skip == 'false'
        id: bump
        run: |
          set +e
          uv run cz bump --yes
          code=$?
          set -e
          if [[ $code -eq 0 ]]; then
            NEW_VERSION=$(uv run python -c "import tomllib; f=open('pyproject.toml','rb'); d=tomllib.load(f); print(d['project']['version'])")
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          elif [[ $code -eq 21 ]]; then
            echo "No releasable commits — nothing to bump."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "cz bump failed with exit code $code."
            exit $code
          fi
        env:
          FORCE_COLOR: "1"

      - name: Push bump branch
        if: steps.guard.outputs.skip == 'false' && steps.bump.outputs.bumped == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git push origin --delete "chore/version-bump-$NEW_VERSION" || true
          git checkout -b "chore/version-bump-$NEW_VERSION"
          git push origin "chore/version-bump-$NEW_VERSION"

      - name: Open and auto-merge version bump PR
        if: steps.guard.outputs.skip == 'false' && steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          if gh pr list --head "chore/version-bump-$NEW_VERSION" --state open | grep -q .; then
            echo "PR already open for chore/version-bump-$NEW_VERSION — skipping."
          else
            gh pr create \
              --title "bump: $NEW_VERSION" \
              --body "Automated version bump to $NEW_VERSION generated by Commitizen." \
              --base main \
              --head "chore/version-bump-$NEW_VERSION"
            gh pr edit "chore/version-bump-$NEW_VERSION" --add-label automated || true
            # CI skips bump branches. If the skipped checks finish first, the PR is
            # already mergeable and GitHub refuses --auto. Then merge it at once.
            gh pr merge "chore/version-bump-$NEW_VERSION" --squash --auto \
              || gh pr merge "chore/version-bump-$NEW_VERSION" --squash
          fi
