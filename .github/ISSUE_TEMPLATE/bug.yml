name: Bug
description: Something does not work as it should.
labels: ["type: bug", "needs triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Tell what you did and what occurred.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `diffract BASE HEAD --src src`
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, diffract and sheridan-iceberg versions.
